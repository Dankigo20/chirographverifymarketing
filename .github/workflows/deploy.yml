name: Deploy marketing site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time; never cancel a live publish midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Uses the committed package-lock.json (npm ci, not npm install) so the
      # published build matches the lockfile exactly.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The site is a static SPA that uses HASH routing (see src/hooks/
      # useHashRoute.ts), so every URL is served from the one index.html and
      # no server-side SPA fallback is required.

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages for this repository on first run. Ignored if the
          # repository's Pages source is already set to "GitHub Actions".
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4